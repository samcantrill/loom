name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure weave dependency access
        env:
          WEAVE_DEPLOY_KEY: ${{ secrets.WEAVE_DEPLOY_KEY }}
        run: |
          if [ -z "${WEAVE_DEPLOY_KEY}" ]; then
            echo "::error title=Missing WEAVE_DEPLOY_KEY::Add a read-only deploy key secret that can access samcantrill/weave."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${WEAVE_DEPLOY_KEY}" > ~/.ssh/weave_deploy_key
          chmod 600 ~/.ssh/weave_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/weave_deploy_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:samcantrill/weave.git".insteadOf "https://github.com/samcantrill/weave.git"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate PR
        run: make validate-pr
