name: subprocess-pipeline-example
schema_version: 1
pipeline:
  name: subprocess-pipeline-example
  description: Two stages that can run locally or through subprocess workers.
  stages:
    - name: seed
      factory:
        _target_: stages:SeedNumbersStage
      config:
        values: [3, 6, 9]
      outputs:
        numbers:
          artifact_type: json
          codec_key: json.v1

    - name: summarize
      factory:
        _target_: stages:SummarizeNumbersStage
      inputs:
        numbers: seed.numbers
      outputs:
        summary:
          artifact_type: json
          codec_key: json.v1
