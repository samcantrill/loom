pipeline:
  name: managed-remote-lifecycle
  stages:
    - name: work
      factory:
        _target_: stages.WorkStage
        init:
          duration_seconds: 20
      resources:
        entries:
          cpu: {kind: cpu, amount: 1, unit: count}
      outputs:
        report:
          artifact_type: json
          codec_key: json.v1
runtime:
  executor: local
