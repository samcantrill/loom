name: diagnostics-local-workflow
schema_version: 1
pipeline:
  name: diagnostics-local-workflow
  stages:
    - name: seed
      factory:
        _target_: stages:SeedNumbersStage
      config:
        values: [3, 6, 9]
      outputs:
        numbers:
          artifact_type: json
          codec_key: json.v1

    - name: summarize
      factory:
        _target_: stages:SummarizeNumbersStage
      inputs:
        numbers: seed.numbers
      outputs:
        summary:
          artifact_type: json
          codec_key: json.v1
        note:
          artifact_type: text
          codec_key: text.v1
