pipeline:
  name: managed-local-basic
  stages:
    - name: produce
      factory:
        _target_: stages.ProduceStage
      resources:
        entries:
          cpu: {kind: cpu, amount: 1, unit: count}
      outputs:
        data:
          artifact_type: json
          codec_key: json.v1
    - name: consume
      factory:
        _target_: stages.ConsumeStage
      resources:
        entries:
          cpu: {kind: cpu, amount: 1, unit: count}
      depends_on: [produce]
      inputs:
        data: produce.data
      outputs:
        report:
          artifact_type: text
          codec_key: text.v1
runtime:
  executor: local
