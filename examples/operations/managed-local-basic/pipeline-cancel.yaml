pipeline:
  name: managed-local-cancellation
  stages:
    - name: stop_early
      factory:
        _target_: stages.StopEarlyStage
      resources:
        entries:
          cpu: {kind: cpu, amount: 1, unit: count}
      outputs:
        data:
          artifact_type: json
          codec_key: json.v1
    - name: downstream
      factory:
        _target_: stages.ProduceStage
      depends_on: [stop_early]
      resources:
        entries:
          cpu: {kind: cpu, amount: 1, unit: count}
      outputs:
        data:
          artifact_type: json
          codec_key: json.v1
runtime:
  executor: local
