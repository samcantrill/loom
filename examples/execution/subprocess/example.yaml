id: execution.subprocess
title: Subprocess Pipeline Run
summary: Run synthetic pipelines with local and subprocess executors, inspect subprocess failures, and invoke a prepared stage worker directly.
capability: execution
level: intermediate
introduced_in: v5
status: runnable
validation: smoke
surface: cli
public_surfaces:
  - cli
owner_docs:
  - examples/execution/README.md
  - docs/features/authority-example-coverage.md
owner_stages:
  - v5
  - v10
validation_path: tests/integration/docs/test_v0_python_examples.py::test_smoke_example_scripts_execute
validation_command: uv run pytest tests/integration/docs/test_v0_python_examples.py::test_smoke_example_scripts_execute
entrypoints:
  - path: run_subprocess_pipeline.py
    kind: python
    description: Run the same success pipeline locally and through subprocess workers.
  - path: run_failure_diagnostics.py
    kind: python
    description: Run a failing subprocess stage and inspect status and stderr logs.
  - path: run_direct_worker.py
    kind: python
    description: Prepare one stage attempt and execute it through the public worker command.
tags:
  - subprocess
  - stage-worker
  - diagnostics
