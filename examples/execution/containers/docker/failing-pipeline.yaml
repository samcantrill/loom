name: docker-failure-example
schema_version: 1
runtime:
  profile: docker-default
runtime_profiles:
  docker-default:
    executor: docker
    adapter_options:
      container:
        image:
          reference: python:3.12-slim
        environment:
          variables:
            LOOM_CONTAINER_EXAMPLE: docker-failure
      docker:
        network: none
        remove: true
pipeline:
  name: docker-failure-example
  stages:
    - name: fail
      factory:
        _target_: stages:FailingNumbersStage
      outputs:
        never:
          artifact_type: json
          codec_key: json.v1
