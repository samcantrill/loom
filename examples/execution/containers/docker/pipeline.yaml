name: docker-pipeline-example
schema_version: 1
runtime:
  profile: docker-default
runtime_profiles:
  docker-default:
    executor: docker
    adapter_options:
      container:
        image:
          reference: python:3.12-slim
        environment:
          variables:
            LOOM_CONTAINER_EXAMPLE: docker-pipeline
      docker:
        network: none
        remove: true
pipeline:
  name: docker-pipeline-example
  description: Two generic stages that can run through the Docker executor.
  stages:
    - name: seed
      factory:
        _target_: stages:SeedNumbersStage
      config:
        values: [5, 10, 15]
      outputs:
        numbers:
          artifact_type: json
          codec_key: json.v1

    - name: summarize
      factory:
        _target_: stages:SummarizeNumbersStage
      inputs:
        numbers: seed.numbers
      outputs:
        summary:
          artifact_type: json
          codec_key: json.v1
