name: config-basic-composition-example
schema_version: 1
paths:
  workspace: ./workspace
  reports: ${paths.workspace}/reports
settings:
  batch_size: 4
  mode: standard
  retry_count: 1
  api_token: base-token
labels:
  owner: local
pipeline:
  label: baseline
  input_uri: ${paths.workspace}/input
  output_uri: ${paths.reports}/summary.json
  checks:
    enabled: true
